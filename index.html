<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f5f2ec" />
<title>Sippy</title>
<link rel="manifest" href="manifest.webmanifest" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;500;600;700&family=Frank+Ruhl+Libre:wght@500;700;900&family=Noto+Sans+Arabic:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f1ea; --paper2:#faf8f2; --card:#fffdf8;
    --ink:#16323c; --ink-soft:#526d78; --ink-faint:#82949c;
    --line:#e7e0d3; --line-2:#dcd3c3;
    --water1:#59bede; --water2:#2a9cc4; --water3:#177fa6;
    --sh-sm:0 1px 2px rgba(22,50,60,.05),0 4px 14px rgba(22,50,60,.06);
    --sh-md:0 12px 34px rgba(22,50,60,.12);
    --r:16px; --serif:"Frank Ruhl Libre",Georgia,serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{margin:0; font-family:"Assistant","Noto Sans Arabic",-apple-system,BlinkMacSystemFont,sans-serif;
    color:var(--ink); background:var(--paper); min-height:100dvh; display:flex; flex-direction:column;
    -webkit-user-select:none; user-select:none; overflow-x:hidden; letter-spacing:-.01em;}
  /* immersive water */
  .sea{position:fixed; left:0; right:0; bottom:0; height:0; z-index:0; pointer-events:none; transition:height .95s cubic-bezier(.22,1,.36,1); display:none;}
  .sea .fill{position:absolute; inset:0; background:linear-gradient(180deg,var(--water1),var(--water3)); opacity:.9;}
  .sea.full .fill{opacity:.98; filter:saturate(1.12);}
  .sea .wv{position:absolute; top:-14px; left:-25%; width:150%; height:26px;}
  .sea .wv svg{width:100%; height:100%; display:block; animation:wave 6s linear infinite;}
  @keyframes wave{from{transform:translateX(0);}to{transform:translateX(-33.333%);}}
  .sea .bub{position:absolute; bottom:2%; border-radius:50%; background:rgba(255,255,255,.4); opacity:0; animation:rise 5s ease-in infinite;}
  @keyframes rise{0%{opacity:0; transform:translateY(0) scale(.4);}20%{opacity:.6;}100%{opacity:0; transform:translateY(-42vh) scale(1);}}
  .wrap{position:relative; z-index:1; width:100%; max-width:430px; margin:0 auto; flex:1; display:flex; flex-direction:column; padding:16px 20px calc(20px + env(safe-area-inset-bottom));}
  .topbar{display:flex; align-items:center; justify-content:space-between; gap:8px; padding:2px 0 8px;}
  .brand{font-family:var(--serif); font-weight:700; font-size:26px; letter-spacing:-.01em; color:var(--ink);}
  .top-actions{display:flex; align-items:center; gap:8px;}
  .icon-btn{border:none; background:var(--card); color:var(--ink); font-family:inherit; height:40px; padding:0 12px; border-radius:13px;
    display:inline-flex; align-items:center; gap:6px; justify-content:center; cursor:pointer; box-shadow:var(--sh-sm); transition:transform .16s ease; font-weight:700; font-size:13px;}
  .icon-btn.sq{width:40px; padding:0;}
  .icon-btn:active{transform:scale(.94);}
  .icon-btn svg{display:block;}
  .screen{flex:1; display:flex; flex-direction:column; animation:fade .4s ease;}
  @keyframes fade{from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;}}
  .hidden{display:none !important;}
  .head{margin:12px 2px 20px;}
  .head h1{font-family:var(--serif); font-size:30px; margin:0 0 6px; font-weight:700; letter-spacing:-.01em; line-height:1.15;}
  .head p{margin:0; color:var(--ink-soft); font-size:15px; font-weight:500;}
  .grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .vessel-opt{background:var(--card); border:1.5px solid var(--line); border-radius:20px; padding:18px 12px 13px;
    display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;
    transition:transform .16s ease, border-color .18s, box-shadow .18s; position:relative; box-shadow:var(--sh-sm);}
  .vessel-opt:active{transform:scale(.96);}
  .vessel-opt.sel{border-color:var(--ink); box-shadow:0 0 0 2.5px rgba(22,50,60,.1), var(--sh-md);}
  .vessel-opt .vol{font-family:var(--serif); font-weight:700; font-size:20px;}
  .vessel-opt .unit{color:var(--ink-faint); font-size:12px; font-weight:600;}
  .check{position:absolute; top:10px; inset-inline-end:10px; width:22px; height:22px; border-radius:50%;
    background:var(--ink); color:var(--paper2); display:none; place-items:center; animation:fade .25s ease;}
  .vessel-opt.sel .check{display:grid;}
  .custom-tile{border-style:dashed; border-color:var(--line-2); background:transparent; box-shadow:none; justify-content:center; min-height:110px;}
  .custom-tile .circ{width:34px; height:34px; border-radius:50%; border:1.5px solid var(--ink-faint); color:var(--ink-soft); display:grid; place-items:center; font-size:20px; margin-bottom:2px;}
  .custom-tile .lbl{font-size:13.5px; font-weight:700; color:var(--ink-soft);}
  .custom-tile:active{transform:scale(.97);}
  .custom-panel{margin-top:12px; background:var(--card); border:1.5px solid var(--line); border-radius:18px; padding:14px; display:none; animation:fade .25s ease; box-shadow:var(--sh-sm);}
  .custom-panel.show{display:block;}
  .cp-lbl{font-size:13px; color:var(--ink-soft); margin-bottom:9px; font-weight:600;}
  .cp-row{display:flex; gap:10px;}
  .cp-row input{flex:1; border:1.5px solid var(--line-2); border-radius:14px; padding:12px 14px; font-size:16px; font-family:var(--serif); font-weight:700; color:var(--ink); outline:none; min-width:0; text-align:center; background:var(--paper2);}
  .cp-row input:focus{border-color:var(--ink);}
  .cp-add{border:none; border-radius:14px; padding:0 18px; background:var(--ink); color:var(--paper2); cursor:pointer; display:grid; place-items:center;}
  .cp-add:active{transform:scale(.95);}
  .btn{border:none; border-radius:var(--r); padding:16px 20px; font-size:16px; font-weight:700; font-family:inherit; letter-spacing:-.01em;
    cursor:pointer; background:var(--ink); color:var(--paper2); box-shadow:var(--sh-md); transition:transform .16s ease, opacity .16s;}
  .btn:active{transform:translateY(1px) scale(.99);}
  .btn.dead{background:var(--line); color:var(--ink-faint); box-shadow:none; cursor:default;}
  .footer-cta{margin-top:auto; padding-top:16px;}
  .pickhint{text-align:center; color:var(--ink-faint); font-size:13px; font-weight:600; margin-bottom:10px; min-height:16px;}
  .footer-cta .btn{width:100%;}
  /* main */
  .today-label{text-align:center; color:var(--ink-faint); font-size:12px; font-weight:700; letter-spacing:.18em; text-transform:uppercase; margin-top:4px;}
  .amount{text-align:center; margin-top:4px;}
  .amount .big{display:inline-flex; align-items:baseline; gap:7px; font-family:var(--serif); font-weight:700; font-size:60px; line-height:1.05; letter-spacing:-.02em; text-shadow:0 2px 24px var(--paper);}
  .amount .big .u{font-size:20px; font-weight:500; color:var(--ink-soft);}
  .goalbtn{margin-top:8px; background:none; border:none; font-family:inherit; color:var(--ink-soft); font-size:14.5px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:5px; padding:4px 8px; border-radius:10px;}
  .goalbtn .cv{opacity:.6;}
  .goalbtn:active{background:rgba(22,50,60,.05);}
  .stage{flex:1; min-height:60px;}
  .dock{background:rgba(255,253,248,.72); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    border:1px solid rgba(231,224,211,.8); border-radius:24px; padding:14px 12px; box-shadow:var(--sh-md);}
  .vessels{display:flex; flex-wrap:wrap; gap:10px; justify-content:center;}
  .vbtn{background:var(--card); border:1.5px solid var(--line); border-radius:15px; padding:11px 14px 9px; min-width:70px;
    display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; box-shadow:var(--sh-sm); transition:transform .14s ease, border-color .16s;}
  .vbtn:active{transform:scale(.93); border-color:var(--ink);}
  .vbtn .vlabel{font-family:var(--serif); font-weight:700; font-size:15px;}
  .undo-wrap{display:flex; justify-content:center; margin-top:12px; height:38px;}
  .undo{background:transparent; border:none; color:var(--ink-soft); height:38px; padding:0 14px; border-radius:19px; display:inline-flex; align-items:center; gap:7px; cursor:pointer; transition:opacity .2s; font-family:inherit; font-weight:700; font-size:13.5px; opacity:0; pointer-events:none;}
  .undo.on{opacity:1; pointer-events:auto;}
  .undo:active{opacity:.6;}
  .float{position:absolute; left:50%; top:30%; transform:translateX(-50%); font-family:var(--serif); font-weight:700; font-size:26px; color:var(--water3); opacity:0; pointer-events:none; z-index:5;}
  .float.go{animation:floatUp 1.1s cubic-bezier(.22,1,.36,1) forwards;}
  @keyframes floatUp{0%{opacity:0; transform:translate(-50%,12px) scale(.9);}25%{opacity:.95;}100%{opacity:0; transform:translate(-50%,-52px);}}
  .ripple{position:fixed; border-radius:50%; border:2px solid var(--water2); opacity:0; pointer-events:none; z-index:2;}
  .ripple.go{animation:rip 1.2s ease-out;}
  @keyframes rip{0%{opacity:.5; transform:scale(.6);}100%{opacity:0; transform:scale(2.2);}}
  .toast{position:fixed; left:50%; bottom:calc(150px + env(safe-area-inset-bottom)); transform:translateX(-50%) translateY(24px);
    background:var(--ink); color:var(--paper2); font-weight:600; padding:13px 22px; border-radius:15px; box-shadow:var(--sh-md);
    opacity:0; transition:all .35s cubic-bezier(.22,1,.36,1); z-index:40; font-size:15px; display:flex; align-items:center; gap:9px; pointer-events:none; max-width:88%;}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
  .toast .badge{width:20px; height:20px; border-radius:50%; background:var(--water2); display:grid; place-items:center; color:#fff; flex:none;}
  .overlay{position:fixed; inset:0; background:rgba(22,50,60,.4); display:none; align-items:flex-end; justify-content:center; z-index:20; backdrop-filter:blur(2px);}
  .overlay.show{display:flex; animation:fade .22s ease;}
  .sheet{background:var(--card); width:100%; max-width:430px; border-radius:26px 26px 0 0; padding:8px 22px calc(24px + env(safe-area-inset-bottom)); box-shadow:0 -8px 34px rgba(22,50,60,.16); max-height:82vh; overflow-y:auto;}
  .grab{width:38px; height:4px; border-radius:4px; background:var(--line-2); margin:8px auto 12px;}
  .sheet h2{font-family:var(--serif); margin:0 0 8px; font-size:22px; font-weight:700;}
  .row{display:flex; align-items:center; justify-content:space-between; padding:15px 0; border-bottom:1px solid var(--line);}
  .row .label{font-weight:700; font-size:15.5px;}
  .row .label small{display:block; font-weight:500; color:var(--ink-faint); font-size:12.5px; margin-top:2px;}
  .stepper{display:flex; align-items:center; gap:10px;}
  .stepper button{width:38px; height:38px; border-radius:12px; border:1.5px solid var(--line); background:var(--paper2); font-size:20px; font-weight:700; color:var(--ink); cursor:pointer; font-family:inherit;}
  .stepper button:active{transform:scale(.9);}
  .stepper .val{min-width:96px; text-align:center; font-family:var(--serif); font-weight:700; font-size:18px;}
  .seg{display:flex; gap:4px; background:var(--paper); padding:4px; border-radius:13px;}
  .seg button{padding:8px 15px; border-radius:10px; border:none; background:transparent; font-weight:700; cursor:pointer; color:var(--ink-soft); font-family:inherit; font-size:14px; transition:background .16s;}
  .seg button.on{background:var(--card); color:var(--ink); box-shadow:var(--sh-sm);}
  .row-btn{width:100%; display:flex; align-items:center; justify-content:space-between; padding:16px 0; background:none; border:none; font-family:inherit; font-size:15.5px; font-weight:700; color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line);}
  .row-btn.pick .cur{color:var(--ink-soft); font-weight:600; display:flex; align-items:center; gap:8px;}
  .row-btn .ic{color:var(--ink-soft); display:flex;}
  .danger{color:#b0563a;}
  .sheet .btn{width:100%; margin-top:18px;}
  .lang-list{display:flex; flex-direction:column; gap:0; margin-top:6px;}
  .lang-item{display:flex; align-items:center; justify-content:space-between; padding:14px 4px; border:none; background:none; font-family:inherit; font-size:16px; font-weight:600; color:var(--ink); cursor:pointer; border-bottom:1px solid var(--line);}
  .lang-item .tick{color:var(--ink); opacity:0;}
  .lang-item.on .tick{opacity:1;}
</style>
</head>

<div class="ripple" id="ripple"></div>
<div class="toast" id="toast"></div>

    <button class="btn" id="doneBtn"></button>
  </div>
</div>

<div class="overlay" id="langOverlay">

</div>

    it:{name:"Italiano",code:"IT",dir:"ltr",obTitle:"Da cosa bevi?",obSub:"Scegli i tuoi bicchieri e bottiglie",addOwn:"Misura personale",cpLbl:"Inserisci la misura",pick:"Scegline almeno uno",start:"Inizia",today:"Oggi",settings:"Impostazioni",goal:"Obiettivo giornaliero",goalHint:"imposta il tuo",units:"Unità",language:"Lingua",langTitle:"Lingua",edit:"Modifica i bicchieri",undo:"Annulla",reset:"Reimposta tutto",confirm:"Tocca di nuovo per confermare",done:"Fatto",cheer:"Obiettivo raggiunto!",of:"su",ml:"ml",oz:"fl oz"},
    ru:{name:"Русский",code:"RU",dir:"ltr",obTitle:"Из чего вы пьёте?",obSub:"Выберите свои стаканы и бутылки",addOwn:"Свой размер",cpLbl:"Введите объём",pick:"Выберите хотя бы один",start:"Начать",today:"Сегодня",settings:"Настройки",goal:"Дневная цель",goalHint:"задайте сами",units:"Единицы",language:"Язык",langTitle:"Язык",edit:"Мои ёмкости",undo:"Отменить",reset:"Сбросить всё",confirm:"Нажмите ещё раз",done:"Готово",cheer:"Дневная цель достигнута!",of:"из",ml:"мл",oz:"унц."},
    ar:{name:"العربية",code:"ع",dir:"rtl",obTitle:"مِمَّ تشرب؟",obSub:"اختر الأكواب والزجاجات لديك",addOwn:"حجم مخصص",cpLbl:"أدخل الحجم",pick:"اختر واحدًا على الأقل",start:"ابدأ",today:"اليوم",settings:"الإعدادات",goal:"الهدف اليومي",goalHint:"حدده بنفسك",units:"الوحدات",language:"اللغة",langTitle:"اللغة",edit:"تعديل الأكواب",undo:"تراجع",reset:"إعادة ضبط الكل",confirm:"اضغط مرة أخرى للتأكيد",done:"تم",cheer:"تم بلوغ الهدف اليومي!",of:"من",ml:"مل",oz:"أونصة"}
  };
  var PRESETS_ML=[{t:"cup",v:200},{t:"cup",v:250},{t:"mug",v:350},{t:"bottle",v:500},{t:"bottle",v:750},{t:"bottle",v:1000}];
  var PRESETS_OZ=[8,12,16,20,24,32].map(function(o,i){return {t:["cup","cup","mug","bottle","bottle","bottle"][i], v:Math.round(o*OZ)};});
  var SHAPES={
    cup:"M12 8h22l-2.6 33a4 4 0 0 1-4 3.6H18.6a4 4 0 0 1-4-3.6z",
    mug:"M10 13h22v26a5 5 0 0 1-5 5H15a5 5 0 0 1-5-5z",
    bottle:"M19 4h8v5c0 2 .8 3 1.8 4l2 2.6c1 1.6 1.7 3.6 1.7 5.6V40a4 4 0 0 1-4 4H19.5a4 4 0 0 1-4-4V21.2c0-2 .7-4 1.7-5.6l2-2.6c1-1 1.8-2 1.8-4z"
  };
  function icon(type,size,fill){var s=size||1,w=Math.round(44*s),h=Math.round(52*s),col="#16323c",id="c"+(CID++);
    var extra=type==="mug"?'<path d="M32 18h4a5 5 0 0 1 0 13h-4" fill="none" stroke="'+col+'" stroke-width="2.4"/>':'';
    var water="";
    if(fill&&fill>0){var y=54-(fill*46);water='<clipPath id="'+id+'"><path d="'+SHAPES[type]+'"/></clipPath><g clip-path="url(#'+id+')"><rect x="0" y="'+y+'" width="46" height="54" fill="#59bede" opacity="0.85"/></g>';}
    return '<svg width="'+w+'" height="'+h+'" viewBox="0 0 46 54">'+water+'<path d="'+SHAPES[type]+'" fill="none" stroke="'+col+'" stroke-width="2.4" stroke-linejoin="round"/>'+extra+'</svg>';}

  if(/[?#].*reset/.test(location.href)){ try{localStorage.removeItem(K);}catch(e){} }
  var state=load();
  function load(){
    try{var s=JSON.parse(localStorage.getItem(K)); if(s&&s.vessels!==undefined) return s;}catch(e){}
    var loc=(navigator.language||"en").toLowerCase(), two=loc.slice(0,2), lang=L[two]?two:"en";
    var unit=/-us$|^en-us$|-lr$|-mm$/.test(loc)?"oz":"ml";
    return {lang:lang,unit:unit,goal:unit==="oz"?Math.round(64*OZ):2000,vessels:null,onboarded:false,day:today(),total:0,log:[]};
  }
  function save(){localStorage.setItem(K,JSON.stringify(state));}
  function today(){var d=new Date();return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate();}
  function rollover(){if(state.day!==today()){state.day=today();state.total=0;state.log=[];save();if($("totalNum"))renderMain();}}
  var $=function(id){return document.getElementById(id);};
  function t(){return L[state.lang];}
  function uShort(){return state.unit==="oz"?t().oz:t().ml;}
  function ml2disp(ml){return state.unit==="oz"?Math.round(ml/OZ):ml;}
  function disp2ml(v){return state.unit==="oz"?Math.round(v*OZ):Math.round(v);}

  function applyLang(){
    var d=t(); document.documentElement.lang=state.lang; document.documentElement.dir=d.dir;
    $("langCode").textContent=d.code;
    $("langBtn").setAttribute("aria-label",d.language); $("setBtn").setAttribute("aria-label",d.settings);
    $("ob-title").textContent=d.obTitle; $("ob-sub").textContent=d.obSub;
    $("startBtn").textContent=d.start; $("todayLabel").textContent=d.today;
    $("setTitle").textContent=d.settings; $("goalLabel").firstChild.textContent=d.goal;
    $("goalHint").textContent=d.goalHint; $("unitLabel").textContent=d.units;
    $("langLabel").textContent=d.language; $("langCur").textContent=d.name; $("langTitle").textContent=d.langTitle;
    $("editLabel").textContent=d.edit; $("resetLabel").textContent=d.reset; $("doneBtn").textContent=d.done;
    $("cpLbl").textContent=d.cpLbl; $("undoLbl").textContent=d.undo;
    document.querySelector('#unitToggle [data-unit=ml]').textContent=d.ml;
    document.querySelector('#unitToggle [data-unit=oz]').textContent=d.oz;
    seg("unitToggle","unit",state.unit);
    renderOptions(); renderVessels(); renderMain(); renderGoalVal(); renderLangList();
  }
  function seg(id,attr,val){Array.prototype.forEach.call(document.querySelectorAll("#"+id+" button"),function(b){b.classList.toggle("on",b.dataset[attr]===val);});}

  function renderLangList(){var box=$("langList"); box.innerHTML="";
    Object.keys(L).forEach(function(code){var b=document.createElement("button"); b.className="lang-item"+(code===state.lang?" on":"");
      b.innerHTML='<span>'+L[code].name+'</span><span class="tick"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M5 13l4 4L19 7"/></svg></span>';
      b.onclick=function(){state.lang=code; save(); $("langOverlay").classList.remove("show"); applyLang();}; box.appendChild(b);});}

  function initBubbles(){var s=$("sea"); if(s.querySelector(".bub"))return;
    for(var i=0;i<4;i++){var b=document.createElement("div");b.className="bub";b.style.left=(14+i*24)+"%";b.style.animationDelay=(i*1.2)+"s";var dd=(6+Math.random()*7);b.style.width=b.style.height=dd+"px";s.appendChild(b);}}

  var picking=new Set(), customExtra=[];
  function presets(){var base=(state.unit==="oz"?PRESETS_OZ:PRESETS_ML).slice();
    customExtra.forEach(function(ml){if(!base.some(function(p){return p.v===ml;}))base.push({t:"cup",v:ml});});
    base.sort(function(a,b){return a.v-b.v;}); return base;}
  function renderOptions(){
    var grid=$("optGrid"); if(!grid)return; grid.innerHTML="";
    var list=presets(), maxV=list[list.length-1].v;
    list.forEach(function(p){
      var sel=picking.has(p.v); var el=document.createElement("div"); el.className="vessel-opt"+(sel?" sel":"");
      var fr=0.32+0.55*(p.v/maxV);
      el.innerHTML='<div class="check"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 13l4 4L19 7"/></svg></div>'+icon(p.t,1,fr)+'<div class="vol">'+ml2disp(p.v)+'</div><div class="unit">'+uShort()+'</div>';
      el.onclick=function(){if(picking.has(p.v))picking.delete(p.v);else picking.add(p.v);el.classList.toggle("sel");updateStart();};
      grid.appendChild(el);
    });
    var ct=document.createElement("div"); ct.className="vessel-opt custom-tile";
    ct.innerHTML='<div class="circ">+</div><div class="lbl">'+t().addOwn+'</div>';
    ct.onclick=function(){var p=$("customPanel");p.classList.toggle("show");if(p.classList.contains("show"))setTimeout(function(){$("customVol").focus();},50);};
    grid.appendChild(ct); updateStart();
  }
  function updateStart(){var none=picking.size===0; var b=$("startBtn"); b.disabled=none; b.classList.toggle("dead",none); $("pickHint").textContent=none?t().pick:"";}
  $("addCustom").onclick=function(){var v=parseInt($("customVol").value,10);if(!v||v<1)return;var ml=disp2ml(v);
    picking.add(ml);customExtra.push(ml);$("customVol").value="";$("customPanel").classList.remove("show");renderOptions();};
  $("startBtn").onclick=function(){if(picking.size===0)return;
    var vols=Array.from(picking).sort(function(a,b){return a-b;});
    state.vessels=vols.map(function(ml){var p=presets().filter(function(x){return x.v===ml;})[0]||{t:"cup",v:ml};return {type:p.t,vol:ml};});
    state.onboarded=true; save(); showMain();};
  function showMain(){$("onboard").classList.add("hidden"); $("main").classList.remove("hidden"); $("sea").style.display="block"; initBubbles(); renderVessels(); renderMain();}
  function showOnboard(){$("main").classList.add("hidden"); $("onboard").classList.remove("hidden"); $("sea").style.display="none";}

  function renderVessels(){var box=$("vessels"); if(!box)return; box.innerHTML="";
    (state.vessels||[]).forEach(function(v){var b=document.createElement("button"); b.className="vbtn";
      b.setAttribute("aria-label",t().start+" "+ml2disp(v.vol)+" "+uShort());
      b.innerHTML=icon(v.type,.72,0)+'<span class="vlabel">'+ml2disp(v.vol)+'</span>';
      b.onclick=function(){add(v.vol);}; box.appendChild(b);});}
  function add(ml){var was=state.total; state.total+=ml; state.log.push(ml); save();
    var f=$("float"); f.textContent="+"+ml2disp(ml); f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
    renderMain(true); if(was<state.goal && state.total>=state.goal) celebrate();}
  $("undoBtn").onclick=function(){if(!state.log.length)return; state.total-=state.log.pop(); if(state.total<0)state.total=0; save(); renderMain(true);};
  var shownVal=0, raf=0;
  function renderMain(animate){
    if(!$("totalNum"))return; $("totalUnit").textContent=uShort();
    var target=ml2disp(state.total);
    if(animate){countTo($("totalNum"),shownVal,target);}else{$("totalNum").textContent=target;} shownVal=target;
    $("goalNum").textContent=t().of+" "+ml2disp(state.goal)+" "+uShort();
    var pct=Math.max(0,Math.min(100,state.goal>0?(state.total/state.goal*100):0));
    $("sea").style.height=pct+"%"; $("sea").classList.toggle("full",state.total>=state.goal&&state.goal>0);
    $("undoBtn").classList.toggle("on",state.log.length>0);
  }
  function countTo(el,from,to){if(raf)cancelAnimationFrame(raf);var start=performance.now(),dur=520;
    function step(now){var p=Math.min(1,(now-start)/dur);var v=Math.round(from+(to-from)*(1-Math.pow(1-p,3)));el.textContent=v;if(p<1)raf=requestAnimationFrame(step);else raf=0;}raf=requestAnimationFrame(step);}

  function celebrate(){showToast(t().cheer);
    var r=$("ripple"),bo=document.body,cx=window.innerWidth/2; r.style.left=(cx-75)+"px"; r.style.top=(window.innerHeight*0.6)+"px"; r.style.width=r.style.height="150px";
    r.classList.remove("go"); void r.offsetWidth; r.classList.add("go");}
  var toastT;
  function showToast(msg){var el=$("toast"); el.innerHTML='<span class="badge"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4"><path d="M5 13l4 4L19 7"/></svg></span>'+msg; el.classList.add("show"); clearTimeout(toastT); toastT=setTimeout(function(){el.classList.remove("show");},2400);}

  function renderGoalVal(){if($("goalVal"))$("goalVal").textContent=ml2disp(state.goal)+" "+uShort();}
  function goalStep(dir){var st=state.unit==="oz"?Math.round(4*OZ):100; state.goal=Math.max(st,state.goal+dir*st); save(); renderGoalVal(); renderMain();}
  $("setBtn").onclick=function(){$("overlay").classList.add("show");};
  $("goalBtn").onclick=function(){$("overlay").classList.add("show");};
  $("doneBtn").onclick=function(){$("overlay").classList.remove("show");};
  $("overlay").onclick=function(e){if(e.target===$("overlay"))$("overlay").classList.remove("show");};
  $("goalPlus").onclick=function(){goalStep(1);}; $("goalMinus").onclick=function(){goalStep(-1);};
  $("langBtn").onclick=function(){$("langOverlay").classList.add("show");};
  $("langRow").onclick=function(){$("overlay").classList.remove("show");$("langOverlay").classList.add("show");};
  $("langOverlay").onclick=function(e){if(e.target===$("langOverlay"))$("langOverlay").classList.remove("show");};
  Array.prototype.forEach.call(document.querySelectorAll("#unitToggle button"),function(b){b.onclick=function(){state.unit=b.dataset.unit; save(); shownVal=ml2disp(state.total); applyLang();};});
  $("editVessels").onclick=function(){$("overlay").classList.remove("show");
    picking=new Set((state.vessels||[]).map(function(v){return v.vol;}));
    customExtra=(state.vessels||[]).filter(function(v){return !(state.unit==="oz"?PRESETS_OZ:PRESETS_ML).some(function(p){return p.v===v.vol;});}).map(function(v){return v.vol;});
    state.vessels=null; showOnboard(); renderOptions();};
  var resetArmed=false, resetT;
  $("resetBtn").onclick=function(){
    if(!resetArmed){resetArmed=true; $("resetLabel").textContent=t().confirm; clearTimeout(resetT); resetT=setTimeout(function(){resetArmed=false; $("resetLabel").textContent=t().reset;},3000); return;}
    try{localStorage.removeItem(K);}catch(e){} location.href=location.pathname;
  };

  rollover(); setInterval(rollover,60*1000); applyLang();
  if(state.onboarded && state.vessels){showMain(); shownVal=ml2disp(state.total); renderMain();}
  else{renderOptions();}
})();
</script>
